name: Generate Snake Animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f9a8d4&color_dots=#ebedf0,#fce7f3,#fbcfe8,#f9a8d4,#f472b6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f9a8d4&color_dots=#161b22,#831843,#be185d,#ec4899,#f9a8d4
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
