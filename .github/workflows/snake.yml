name: Generate Snake Animation

on: schedule:

cron: "0 0 * * *"

workflow_dispatch: push: branches: - main

jobs: generate: permissions: contents: write runs-on: ubuntu-latest timeout-minutes: 10

steps: - uses: Platane/snk@v3 with: githubusername: ${{ github.repositoryowner }} outputs: | dist/github-contribution-grid-snake.svg?colorsnake=%23B57574&colordots=%23F8E8E5,%23E8B4B0,%23D99A98,%23B57574,%238F5555 dist/github-contribution-grid-snake-dark.svg?colorsnake=%23F4C2C2&color_dots=%2321191D,%2350313D,%239B626E,%23D99AAB,%23F4C2C2

- uses: crazy-max/ghaction-github-pages@v3.1.0 with: targetbranch: output builddir: dist env: GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
