name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23B57574&color_dots=%23FFF7F5,%23F8E8E5,%23E8B4B0,%23D99A98,%23B57574
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F4C2C2&color_dots=%23212830,%233A252C,%2350313D,%239B626E,%23F4C2C2

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
